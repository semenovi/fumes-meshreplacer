name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Build
        run: dotnet build MeshReplacer/MeshReplacer.csproj --configuration Release --no-incremental

      - name: Package
        shell: pwsh
        run: |
          $staging = "staging"
          New-Item -ItemType Directory $staging | Out-Null
          Copy-Item "MeshReplacer/bin/Release/net6.0/MeshReplacer.dll" $staging
          if (Test-Path "cars") {
            $dest = "$staging/meshreplacer"
            New-Item -ItemType Directory $dest | Out-Null
            Copy-Item "cars/*" $dest -Recurse
          }
          Compress-Archive -Path "$staging/*" -DestinationPath "MeshReplacer.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MeshReplacer.zip
          generate_release_notes: true
